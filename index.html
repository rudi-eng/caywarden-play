:root {
  --pirata: "Pirata One", Georgia, "Times New Roman", serif;
  --fell: "IM Fell English", Georgia, "Times New Roman", serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #e8d8ae;
}

body {
  font-family: var(--fell), sans-serif;
  color: #3d2c14;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  touch-action: none;
}

#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ------------------------------------------------------------- HUD cards */
.hud-card {
  position: absolute;
  z-index: 10;
  pointer-events: none;
  border: 1px solid rgba(138, 109, 63, 0.6);
  background: rgba(245, 236, 207, 0.94);
  box-shadow: 0 2px 10px rgba(60, 42, 18, 0.25);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}

#hudStatus { left: 12px; top: 12px; padding: 10px 16px; }

.gold-line { display: flex; align-items: baseline; gap: 12px; }
.gold-num { font-family: var(--pirata); font-size: 24px; line-height: 1; color: #3d2c14; }
.gold-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: #8a6d3f; }

.meta-line { margin-top: 4px; display: flex; align-items: center; gap: 12px; font-size: 12px; color: #5b4327; }
.meta-line .fell, #hudDate { font-family: var(--fell); font-style: italic; }
.meta-line .dot { color: #8a6d3f; }

.contract {
  display: none;
  margin-top: 4px;
  padding-top: 4px;
  border-top: 1px solid rgba(138, 109, 63, 0.33);
  font-size: 11px;
  color: #7d1d1d;
}

#hudBars { left: 12px; bottom: 12px; width: 224px; padding: 10px 12px; }

.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.bar-label { width: 40px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a6d3f; }
.bar-track { flex: 1; height: 8px; border: 1px solid rgba(138, 109, 63, 0.53); background: rgba(90, 66, 30, 0.12); }
.bar-fill { height: 100%; width: 50%; transition: width 0.3s; }
.bar-val { width: 48px; text-align: right; font-size: 10px; color: #5b4327; }

.sails-line { margin-top: 6px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #5b4327; }
.wind-wrap { display: flex; align-items: center; gap: 4px; }
#hudWind { display: inline-flex; }
#hudWind svg { transition: transform 0.2s linear; }

.nations { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.nation {
  font-size: 10px; padding: 0 4px; text-transform: uppercase;
  border: 1px solid transparent; color: #8a6d3f; border-radius: 2px;
}
.nation.hostile { border-color: #7d1d1d; background: rgba(125, 29, 29, 0.13); color: #7d1d1d; }

/* ------------------------------------------------------------- feed + prompt */
#hudFeed {
  position: absolute; z-index: 10; pointer-events: none;
  left: 50%; top: 12px; transform: translateX(-50%);
  width: min(560px, 80vw);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  text-align: center;
}
.feed-item {
  display: inline-block;
  border: 1px solid rgba(138, 109, 63, 0.4);
  background: rgba(238, 222, 183, 0.85);
  padding: 4px 12px;
  font-size: 12.5px;
  color: #5b4327;
}

#hudPrompt {
  position: absolute; z-index: 10; pointer-events: none;
  left: 50%; bottom: 96px; transform: translateX(-50%);
  border: 1px solid #8a6d3f;
  background: rgba(238, 222, 183, 0.9);
  padding: 6px 16px;
  text-align: center;
  font-size: 13px; font-weight: 500; letter-spacing: 0.03em;
  color: #3d2c14;
  box-shadow: 0 2px 8px rgba(60, 42, 18, 0.3);
}

/* ------------------------------------------------------------- round buttons */
#hudButtons {
  position: absolute; z-index: 20;
  right: 12px; top: 12px;
  display: flex; gap: 8px;
}
.round-btn {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  border: 1px solid rgba(138, 109, 63, 0.4);
  background: rgba(238, 222, 183, 0.55);
  color: #3d2c14;
  cursor: pointer;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  transition: background 0.15s;
}
.round-btn:hover { background: rgba(238, 222, 183, 0.8); }
.round-btn svg { width: 20px; height: 20px; }

#tagline {
  position: absolute; z-index: 10; pointer-events: none;
  left: 0; right: 0; bottom: 12px;
  text-align: center;
  font-size: 11px; letter-spacing: 0.3em;
  color: #8a6d3f;
}

/* ------------------------------------------------------------- overlays */
.screen {
  position: absolute; inset: 0; z-index: 30;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  background: rgba(16, 52, 58, 0.45);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.screen.dark { background: rgba(30, 20, 8, 0.62); }

.card {
  border: 1px solid #5b4327;
  background: #f4e9cb;
  box-shadow: 0 10px 40px rgba(40, 26, 8, 0.45);
}
.center-card { width: 100%; max-width: 672px; padding: 32px; text-align: center; }
.narrow { width: 100%; max-width: 384px; padding: 28px 32px; text-align: center; }
.wide { width: 100%; max-width: 768px; display: flex; flex-direction: column; max-height: 100%; }
.center { display: flex; flex-direction: column; align-items: center; }

.overline { font-size: 12px; text-transform: uppercase; letter-spacing: 0.4em; color: #8a6d3f; }
.grand-title { text-shadow: 0 2px #f5e3b0; margin-top: 8px; font-family: var(--pirata); font-weight: 400; font-size: 68px; line-height: 1.05; letter-spacing: 0.02em; color: #3d2c14; }
.subtitle { margin-top: 4px; font-family: var(--fell); font-style: italic; font-size: 18px; color: #5b4327; }
.blurb { margin: 20px auto 0; max-width: 32rem; font-family: var(--fell); font-size: 14px; line-height: 1.6; color: #5b4327; }

.btn-row { margin-top: 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; }
.best-line { margin-top: 16px; font-family: var(--fell); font-size: 12px; letter-spacing: 0.06em; color: #8a6d3f; }

.controls-grid {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid rgba(138, 109, 63, 0.33);
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 6px 24px;
  text-align: left;
  font-family: var(--fell); font-size: 12px; color: #5b4327;
}
.controls-grid b { color: #3d2c14; }

.card-title { font-family: var(--pirata); font-weight: 400; font-size: 32px; letter-spacing: 0.02em; color: #3d2c14; }
.card-title.red { color: #7d1d1d; font-size: 36px; }
.card-sub { margin-top: 4px; font-family: var(--fell); font-style: italic; font-size: 13px; color: #8a6d3f; }

.stack { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; width: 100%; }
.stack-sm { display: flex; flex-direction: column; gap: 12px; }
.note { margin-top: 16px; font-family: var(--fell); font-style: italic; font-size: 12px; color: #8a6d3f; }
.hint { font-family: var(--fell); font-style: italic; font-size: 12px; color: #8a6d3f; }
.flavor { font-family: var(--fell); font-style: italic; font-size: 13.5px; color: #5b4327; }
.cause { margin-top: 8px; font-family: var(--fell); font-style: italic; font-size: 14px; color: #5b4327; }
.cause.long { line-height: 1.6; max-width: 24rem; margin-left: auto; margin-right: auto; }

/* buttons */
.btn, .btn-dark, .btn-red {
  font-family: var(--fell);
  font-size: 14px;
  padding: 8px 16px;
  border: 1px solid #5b4327;
  background: #e3d2a4;
  color: #3d2c14;
  cursor: pointer;
  transition: background 0.15s;
}
.btn:hover { background: #d9c491; }
.btn-dark { border-color: #2a1f10; background: #245e58; color: #fff0cf; padding: 10px 20px; }
.btn-dark:hover { background: #5b4327; }
.btn-red { border-color: #5d130f; background: #7d1d1d; color: #f3e3c2; padding: 10px 20px; }
.btn-red:hover { background: #8f2a2a; }
.btn:disabled, .btn-dark:disabled, .btn-red:disabled {
  cursor: not-allowed; opacity: 0.45;
}
.btn:disabled:hover, .btn-dark:disabled:hover, .btn-red:disabled:hover { background: #e3d2a4; }
.btn-dark:disabled:hover { background: #3d2c14; }
.btn-red:disabled:hover { background: #7d1d1d; }
.mt { margin-top: 20px; }

/* stats grid (endings) */
.stats-grid {
  margin: 16px auto 0; max-width: 320px; width: 100%;
  display: grid; grid-template-columns: 1fr auto;
  gap: 6px 24px;
  padding: 16px 0;
  border-top: 1px solid rgba(138, 109, 63, 0.33);
  border-bottom: 1px solid rgba(138, 109, 63, 0.33);
  text-align: left;
  font-family: var(--fell); font-size: 13.5px; color: #5b4327;
}
.stats-grid span:nth-child(even) { text-align: right; }

/* port overlay */
.port-head { padding: 20px 24px 12px; text-align: center; border-bottom: 1px solid rgba(138, 109, 63, 0.47); }
.port-name { font-family: var(--pirata); font-weight: 400; font-size: 30px; letter-spacing: 0.02em; color: #3d2c14; }
.port-desc { margin: 4px auto 0; max-width: 36rem; font-family: var(--fell); font-style: italic; font-size: 13px; line-height: 1.4; color: #5b4327; }
.port-stats { margin-top: 8px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 20px; font-size: 12.5px; color: #5b4327; }

.tabs { display: flex; gap: 4px; padding: 12px 16px 0; }
.tab {
  font-family: var(--fell);
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.14em;
  padding: 8px 12px;
  border: 1px solid transparent; border-bottom: none;
  background: transparent; color: #8a6d3f;
  cursor: pointer; transition: color 0.15s;
}
.tab:hover { color: #5b4327; }
.tab.active { border-color: #5b4327; background: #e3d2a4; color: #3d2c14; }

.port-body {
  min-height: 240px;
  overflow-y: auto;
  border-top: 1px solid #5b4327;
  background: #e8e6c9;
  padding: 16px 20px;
}
.port-msg {
  margin-bottom: 12px;
  border: 1px solid rgba(138, 109, 63, 0.53);
  background: #f3e8cd;
  padding: 6px 12px;
  text-align: center;
  font-family: var(--fell); font-size: 13px; color: #5b4327;
}

.row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  border: 1px solid rgba(138, 109, 63, 0.4);
  background: #f4e9cb;
  padding: 10px 12px;
}
.row-text { flex: 1; min-width: 180px; }
.row-title { font-family: var(--fell); font-size: 14px; color: #3d2c14; }
.row-desc { font-family: var(--fell); font-size: 12px; color: #8a6d3f; }
.row-right { display: flex; gap: 8px; flex-shrink: 0; }

.good-row {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid rgba(138, 109, 63, 0.4);
  background: #f4e9cb;
  padding: 8px 12px;
  margin-bottom: 8px;
}
.good-name { width: 80px; font-family: var(--fell); font-size: 14px; color: #3d2c14; }
.good-price { width: 96px; font-size: 12px; color: #8a6d3f; }
.good-have { width: 96px; font-size: 12px; color: #5b4327; }
.good-btns { margin-left: auto; display: flex; gap: 8px; }

.port-foot {
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid rgba(138, 109, 63, 0.47);
  padding: 12px 20px;
}

/* help overlay */
#helpOverlay .screen { z-index: 40; }
.help-head { padding: 16px 24px; text-align: center; border-bottom: 1px solid rgba(138, 109, 63, 0.47); }
.help-body { max-height: 60vh; overflow-y: auto; padding: 16px 24px; }
.help-row { display: flex; gap: 16px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(138, 109, 63, 0.2); }
.help-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.help-key { width: 80px; flex-shrink: 0; font-family: var(--fell); font-size: 13px; font-weight: 700; color: #3d2c14; }
.help-val { font-family: var(--fell); font-size: 13px; line-height: 1.45; color: #5b4327; }
.help-foot { padding: 12px 24px; text-align: center; border-top: 1px solid rgba(138, 109, 63, 0.47); }

/* ------------------------------------------------------------- touch controls */
#touch { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#touch > * { pointer-events: auto; }

#helmBase {
  position: absolute;
  bottom: 112px; left: 16px;
  width: 112px; height: 112px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  border: 2px solid rgba(91, 67, 39, 0.53);
  background: rgba(238, 222, 183, 0.35);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  touch-action: none;
}
.helm-ring { position: absolute; inset: 10px; border-radius: 50%; border: 1px solid rgba(91, 67, 39, 0.27); pointer-events: none; }
#helmKnob {
  width: 48px; height: 48px; border-radius: 50%;
  border: 2px solid rgba(91, 67, 39, 0.6);
  background: radial-gradient(circle at 35% 30%, #8a6d3f, #3d2c14);
  box-shadow: 0 4px 10px rgba(40, 26, 8, 0.4);
  transition: transform 0.075s;
  pointer-events: none;
}
.helm-label { position: absolute; bottom: -20px; left: 0; right: 0; text-align: center; font-size: 10px; letter-spacing: 0.2em; color: #5b4327; pointer-events: none; }

.touch-actions { position: absolute; bottom: 24px; left: 20px; display: flex; align-items: center; gap: 12px; }
.tap-btn {
  width: 48px; height: 48px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 50%;
  border: 1px solid rgba(138, 109, 63, 0.6);
  background: rgba(238, 222, 183, 0.6);
  color: #3d2c14;
  cursor: pointer;
  touch-action: none;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.tap-btn:active { background: rgba(238, 222, 183, 0.9); }
.tap-btn svg { width: 20px; height: 20px; }
.tap-btn span { font-size: 8px; letter-spacing: 0.12em; }

.touch-fire { position: absolute; bottom: 24px; right: 20px; display: flex; align-items: flex-end; gap: 16px; }
.fire-btn {
  width: 72px; height: 72px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 50%;
  border: 2px solid rgba(91, 67, 39, 0.53);
  background: rgba(125, 29, 29, 0.75);
  color: #f3e3c2;
  box-shadow: 0 4px 0 rgba(40, 26, 8, 0.45);
  cursor: pointer;
  touch-action: none;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  transition: transform 0.05s, box-shadow 0.05s;
}
.fire-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(40, 26, 8, 0.45); }
.fire-btn svg { width: 24px; height: 24px; }
.fire-btn span { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; }

/* ------------------------------------------------------------- responsive */
@media (max-width: 640px) {
  .grand-title { font-size: 48px; }
  .center-card { padding: 24px 16px; }
  .controls-grid { grid-template-columns: repeat(2, 1fr); }
  #hudStatus { max-width: 62vw; }
  #hudBars { width: 190px; }
  .good-name { width: 60px; }
  .good-price, .good-have { width: auto; }
  .good-row { flex-wrap: wrap; }
}
#hudFeed { top: 132px; width: min(480px,80vw); }
